# ============================================================
# 变形重复实验配置 (experiment.py 读取)
# ============================================================
# configs: 9 个构型 c1..c9 的关节编码器值。
#   - 每行 17 个整数，对应电机 ID 1..17 的 Present/Goal Position 编码器计数。
#   - 编码器范围 0~4095 (一圈 4096 计数，2048≈中位)。
#   - 获取方法：把机器人摆到目标构型后，调用 /dynamixel_control/pos 服务
#     (dynamixel_msgs/GetPos) 读回的 pos 数组，或读 /dynamixel_control/log 的 P 字段。
#   - 顺序与 sim2real/real2sim 的 real 空间一致 (电机物理 ID 升序)。
#   - 下方为占位值 (全 2048)，请逐行替换为实测编码器值。
configs:
  c1: [3137, 3137, 1900, 1600, 1700, 2400, 1872, 4000, 1700, 1872, 4000, 1700, 1872, 4000, 2400, 1872, 4000]
  c2: [2100, 2100, 1536, 1024, 1536, 2560, 2611, 4000, 1536, 2611, 4000, 1536, 2611, 4000, 2560, 2611, 4000]
  c3: [1024, 1024, 1536, 1024, 1536, 2560, 3123, 4000, 1536, 3123, 4000, 1536, 3123, 4000, 2560, 3123, 4000]
  c4: [1024, 1024, 1200, 341, 1200, 2901, 3123, 4000, 1195, 3123, 4000, 1195, 3123, 4000, 2901, 3123, 4000]
  c5: [2100, 2100, 1200, 341, 1200, 2901, 2611, 4000, 1195, 2611, 4000, 1195, 2611, 4000, 2901, 2611, 4000]
  c6: [3137, 3137, 1200, 341, 1200, 2900, 1872, 4000, 1300, 1872, 4000, 1300, 1872, 4000, 2900, 1872, 4000]
  c7: [2100, 2100, 2048, 2048, 2048, 2048, 2611, 4000, 2048, 2611, 4000, 2048, 2611, 4000, 2048, 2611, 4000]
  c8: [1024, 1024, 2048, 2048, 2048, 2048, 3123, 4000, 2048, 3123, 4000, 2048, 3123, 4000, 2048, 3123, 4000]
  c9: [3137, 3137, 2048, 2048, 2048, 2048, 1872, 4000, 2048, 1872, 4000, 2048, 1872, 4000, 2048, 1872, 4000]

# 一次实验的构型访问顺序：c1->...->c9->c8->...->c1 (往返回到起点)。
# 如需自定义可修改此列表 (用上面的键名)。
sequence: [c1, c2, c3, c4, c5, c6, c7, c8, c9, c8, c7, c6, c5, c4, c3, c2, c1]

# ---- 插值与下发参数 ----
steps: 10          # 相邻两构型之间的线性插值步数 (一段)
step_time: 0.01     # 每个插值帧之间的间隔 (秒)，下发节奏
settle_time: 3.0    # 到达每个构型后停留时间 (秒)，等待稳定再进入下一段
flag_sim: false     # 实物实验固定 false (sim 空间插值 + sim2real 下发)

# ---- 实验流程参数 ----
num_experiments: 10 # 重复实验次数
wait_enter: true    # 每次实验结束后是否等待回车再开始下一次

# ---- rosbag 录制 ----
# bag_dir: 相对路径挂到工作空间根目录下 (如 "bags" -> <workspace>/bags)，
#          绝对路径或 ~ 开头则按原样使用。
bag_dir: "bags"                    # rosbag 输出目录 (自动创建)
bag_prefix: "trans_exp"            # 文件名前缀，最终为 <prefix>_<序号>_<时间戳>.bag
bag_topics:
  - /crimson_control/transform
  - /crimson_control/transformed
  - /dynamixel_control/log
