name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install 'ruff>=0.15,<0.16'
      - name: Check source, documentation and artifact manifests
        run: python scripts/check_repository.py
      - name: Lint maintained source
        run: ruff check .
      - name: Check maintained source formatting
        run: ruff format --check .
